# Merge with docker-compose.distributed.yml. Native DeFMI starts BEFORE orders.
services:
  native-bootstrap:
    image: ${OCLOB_CLUSTER_IMAGE}
    user: "${OCLOB_UID:-10001}:${OCLOB_GID:-10001}"
    networks: [oclob-private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${OCLOB_RUNTIME_DIR}/cluster/public:/public:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/coordinator:/identity:ro
      - ${OCLOB_RUNTIME_DIR}/handoff:/handoff:rw
    command: [oclob-native-bootstrap, /public/cluster.json, /identity/client.json, /handoff/native-committee.bin]
  defmi:
    image: ${OCLOB_AVALANCHE_IMAGE}
    user: "${OCLOB_UID:-10001}:${OCLOB_GID:-10001}"
    networks:
      oclob-private:
        aliases: [oclob-defmi]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${OCLOB_RUNTIME_DIR}/cluster/public:/public:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/defmi:/defmi:ro
      - ${OCLOB_RUNTIME_DIR}/handoff:/handoff:ro
      - ${OCLOB_RUNTIME_DIR}/out:/out:rw
      - ${OCLOB_SOURCE_DIR}/research:/research:ro
    environment:
      OCLOB_NATIVE_L1_SERVICE: "1"
      OCLOB_NATIVE_WALLET: ${OCLOB_NATIVE_WALLET:-0}
      OCLOB_RESEARCH_CONTRACT: ${OCLOB_NATIVE_CONTRACT:-/research/oclob_native_notes_contract.json}
      OCLOB_RESEARCH_MANIFEST: ${OCLOB_NATIVE_MANIFEST:-/research/manifests/oclob_native_notes_001.json}
      QOMM_AVALANCHE_ARTIFACT: /out/oclob_native_notes.json
    healthcheck:
      test: [CMD, test, -s, /out/native-ready.json]
      interval: 2s
      timeout: 1s
      retries: 120
      start_period: 120s
  maker:
    volumes:
      - ${OCLOB_RUNTIME_DIR}/cluster/maker/queue:/corporate:rw
    environment:
      OCLOB_NATIVE_RESERVATION_CONFIG: /identity/native.json
      OCLOB_CORPORATE_JOURNAL: /corporate/outbox.enc
      OCLOB_CORPORATE_JOURNAL_KEY: /identity/outbox-key.raw
      OCLOB_CORPORATE_REQUEST_ID: native-maker-001
  taker:
    volumes:
      - ${OCLOB_RUNTIME_DIR}/cluster/taker/queue:/corporate:rw
    environment:
      OCLOB_NATIVE_RESERVATION_CONFIG: /identity/native.json
      OCLOB_CORPORATE_JOURNAL: /corporate/outbox.enc
      OCLOB_CORPORATE_JOURNAL_KEY: /identity/outbox-key.raw
      OCLOB_CORPORATE_REQUEST_ID: native-taker-001
  maker-worker:
    image: ${OCLOB_CLUSTER_IMAGE}
    user: "${OCLOB_UID:-10001}:${OCLOB_GID:-10001}"
    networks: [oclob-private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${OCLOB_RUNTIME_DIR}/cluster/public:/public:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/maker:/identity:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/maker/queue:/corporate:rw
    environment:
      OCLOB_MARKET_CONFIG: ${OCLOB_MARKET_CONFIG:-}
      OCLOB_NATIVE_RESERVATION_CONFIG: /identity/native.json
      OCLOB_CORPORATE_JOURNAL: /corporate/outbox.enc
      OCLOB_CORPORATE_JOURNAL_KEY: /identity/outbox-key.raw
    command: [oclob-corporate-worker]
  taker-worker:
    image: ${OCLOB_CLUSTER_IMAGE}
    user: "${OCLOB_UID:-10001}:${OCLOB_GID:-10001}"
    networks: [oclob-private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${OCLOB_RUNTIME_DIR}/cluster/public:/public:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/taker:/identity:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/taker/queue:/corporate:rw
    environment:
      OCLOB_MARKET_CONFIG: ${OCLOB_MARKET_CONFIG:-}
      OCLOB_NATIVE_RESERVATION_CONFIG: /identity/native.json
      OCLOB_CORPORATE_JOURNAL: /corporate/outbox.enc
      OCLOB_CORPORATE_JOURNAL_KEY: /identity/outbox-key.raw
    command: [oclob-corporate-worker]
  market-worker:
    image: ${OCLOB_CLUSTER_IMAGE}
    user: "${OCLOB_UID:-10001}:${OCLOB_GID:-10001}"
    networks:
      oclob-private:
        aliases: [oclob-market]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${OCLOB_RUNTIME_DIR}/cluster/public:/public:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/coordinator:/identity:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/settlement:/settlement:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/market:/market-identity:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/market/state:/market:rw
      - ${OCLOB_RUNTIME_DIR}/cluster/market-public:/market-public:rw
      - ${OCLOB_RUNTIME_DIR}/handoff:/handoff:rw
      - ${OCLOB_SOURCE_DIR}/research:/research:ro
    environment:
      OCLOB_MARKET_CRASH_AFTER_CANONICAL: ${OCLOB_MARKET_CRASH_AFTER_CANONICAL:-0}
      OCLOB_RESEARCH_CONTRACT: ${OCLOB_NATIVE_CONTRACT:-/research/oclob_native_market_contract.json}
      OCLOB_RESEARCH_MANIFEST: ${OCLOB_NATIVE_MANIFEST:-/research/manifests/oclob_native_market_002.json}
    command: [oclob-market-worker]
  public-book:
    image: ${OCLOB_CLUSTER_IMAGE}
    user: "${OCLOB_UID:-10001}:${OCLOB_GID:-10001}"
    networks:
      oclob-private:
        aliases: [oclob-public-book]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${OCLOB_RUNTIME_DIR}/cluster/public:/public:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/public-book:/book-identity:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/market-public:/market-public:ro
    command: [oclob-public-book]
  book-reader:
    image: ${OCLOB_CLUSTER_IMAGE}
    user: "${OCLOB_UID:-10001}:${OCLOB_GID:-10001}"
    networks: [oclob-private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${OCLOB_RUNTIME_DIR}/cluster/public:/public:ro
    command: [oclob-public-book, --get, "0"]
  native-coordinator:
    image: ${OCLOB_CLUSTER_IMAGE}
    user: "${OCLOB_UID:-10001}:${OCLOB_GID:-10001}"
    networks: [oclob-private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      OCLOB_NATIVE_WALLET: ${OCLOB_NATIVE_WALLET:-0}
      OCLOB_RESEARCH_CONTRACT: ${OCLOB_NATIVE_CONTRACT:-/research/oclob_native_notes_contract.json}
      OCLOB_RESEARCH_MANIFEST: ${OCLOB_NATIVE_MANIFEST:-/research/manifests/oclob_native_notes_001.json}
    volumes:
      - ${OCLOB_RUNTIME_DIR}/cluster/public:/public:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/coordinator:/identity:ro
      - ${OCLOB_RUNTIME_DIR}/cluster/settlement:/settlement:ro
      - ${OCLOB_RUNTIME_DIR}/handoff:/handoff:rw
      - ${OCLOB_SOURCE_DIR}/research:/research:ro
    command: [oclob-native-e2e]

[workspace]
resolver = "2"
members = [
  "rust/oclob-core",
  "rust/oclob-dekyx",
  "rust/oclob-edge",
  "rust/oclob-node",
  "rust/oclob-ordering",
  "rust/oclob-mpc",
  "rust/oclob-proofs",
  "rust/oclob-settlement",
  "rust/oclob-service",
  "rust/oclob-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
zkfmi-crypto = { git = "https://github.com/zkFMI/zkfmi-crypto.git", rev = "8675b6d7d65f2437963de7184149af3c56d92d45" }
zkfmi-measure = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
qomm-audit = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
qomm-dsl = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
curve25519-dalek = { version = "4.1.3", features = ["rand_core", "digest"] }
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0.8.5"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
hex = "0.4.3"
merlin = "3.0.0"
openssl = { version = "=0.10.81", features = ["vendored"] }
thiserror = "2.0.17"
libc = "0.2"
tiny_http = "=0.12.0"

oclob-core = { path = "rust/oclob-core" }
oclob-dekyx = { path = "rust/oclob-dekyx" }
oclob-edge = { path = "rust/oclob-edge" }
oclob-node = { path = "rust/oclob-node" }
oclob-ordering = { path = "rust/oclob-ordering" }
oclob-mpc = { path = "rust/oclob-mpc" }
oclob-proofs = { path = "rust/oclob-proofs" }
oclob-settlement = { path = "rust/oclob-settlement" }
oclob-service = { path = "rust/oclob-service" }

# Settlement is pinned to the reviewed standalone DeFMI/zkPI source, while the
# official MP-SPDZ adapter remains pinned to the reviewed QOMM revision that
# exports cryptographically-random Shamir input generation.
# Update these revisions only together with the protocol compatibility tests.
dekyx-core = { git = "https://github.com/zkFMI/dekyx.git", rev = "9518393a58be731fe25147e77d22926062fca33a" }
qomm-mpc = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
defmi = { git = "https://github.com/zkFMI/defmi.git", rev = "15243a7d70169f0c83382139b2db5e2778d51258" }
zkpi-proofs = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
zkpi-committee = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
zkfmi-zk = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
zkpi = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
zkpi-defmi-sdk = { git = "https://github.com/zkFMI/defmi.git", rev = "15243a7d70169f0c83382139b2db5e2778d51258" }

[profile.release]
lto = "thin"
codegen-units = 1

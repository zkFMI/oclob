[workspace]
resolver = "2"
members = [
  "rust/oclob-core",
  "rust/oclob-dekyx",
  "rust/oclob-edge",
  "rust/oclob-node",
  "rust/oclob-ordering",
  "rust/oclob-mpc",
  "rust/oclob-proofs",
  "rust/oclob-settlement",
  "rust/oclob-service",
  "rust/oclob-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
zkfmi-crypto = { git = "https://github.com/zkFMI/zkfmi-crypto.git", rev = "26ebfe96563a05c3379219f7fdacea137ab5fb4f" }
qomm-measure = { git = "https://github.com/zkFMI/zkpi.git", rev = "6228efed75648ac546cd5926797c847deb681dff" }
qomm-audit = { git = "https://github.com/zkFMI/zkpi.git", rev = "6228efed75648ac546cd5926797c847deb681dff" }
qomm-dsl = { git = "https://github.com/zkFMI/zkpi.git", rev = "6228efed75648ac546cd5926797c847deb681dff" }
curve25519-dalek = { version = "4.1.3", features = ["rand_core", "digest"] }
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0.8.5"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
hex = "0.4.3"
merlin = "3.0.0"
openssl = { version = "=0.10.81", features = ["vendored"] }
thiserror = "2.0.17"
libc = "0.2"
tiny_http = "=0.12.0"

oclob-core = { path = "rust/oclob-core" }
oclob-dekyx = { path = "rust/oclob-dekyx" }
oclob-edge = { path = "rust/oclob-edge" }
oclob-node = { path = "rust/oclob-node" }
oclob-ordering = { path = "rust/oclob-ordering" }
oclob-mpc = { path = "rust/oclob-mpc" }
oclob-proofs = { path = "rust/oclob-proofs" }
oclob-settlement = { path = "rust/oclob-settlement" }
oclob-service = { path = "rust/oclob-service" }

# Settlement is pinned to the reviewed standalone DeFMI/zkPI source, while the
# official MP-SPDZ adapter remains pinned to the reviewed QOMM revision that
# exports cryptographically-random Shamir input generation.
# Update these revisions only together with the protocol compatibility tests.
dekyx-core = { git = "https://github.com/zkFMI/dekyx.git", rev = "09c2c1a7295e8cab592aca6af2f89381c3c110ac" }
qomm-mpc = { git = "https://github.com/zkFMI/zkpi.git", rev = "6228efed75648ac546cd5926797c847deb681dff" }
qomm-defmi = { git = "https://github.com/zkFMI/defmi.git", rev = "1b9b0b1d28f6cbd30479fc01399e541ac9379519" }
qomm-proofs = { git = "https://github.com/zkFMI/zkpi.git", rev = "6228efed75648ac546cd5926797c847deb681dff" }
qomm-transport = { git = "https://github.com/zkFMI/zkpi.git", rev = "6228efed75648ac546cd5926797c847deb681dff" }
qomm-zk = { git = "https://github.com/zkFMI/zkpi.git", rev = "6228efed75648ac546cd5926797c847deb681dff" }
qomm-zkpi = { git = "https://github.com/zkFMI/zkpi.git", rev = "6228efed75648ac546cd5926797c847deb681dff" }
zkpi-defmi-sdk = { git = "https://github.com/zkFMI/defmi.git", rev = "1b9b0b1d28f6cbd30479fc01399e541ac9379519" }

[profile.release]
lto = "thin"
codegen-units = 1
